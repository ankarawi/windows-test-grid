name: Twenty

on:
  workflow_dispatch:
    inputs:
      manifest_url:
        description: "Opaque batch manifest URL"
        required: true
        type: string
      manifest_sha256:
        description: "SHA-256 of batch manifest"
        required: true
        type: string
      batch_opaque_id:
        description: "Opaque batch identifier"
        required: true
        type: string

permissions:
  contents: read

jobs:
  run:
    name: ${{ matrix.slot }}
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        slot:
          - slot-00
          - slot-01
          - slot-02
          - slot-03
          - slot-04
          - slot-05
          - slot-06
          - slot-07
          - slot-08
          - slot-09
          - slot-10
          - slot-11
          - slot-12
          - slot-13
          - slot-14
          - slot-15
          - slot-16
          - slot-17
          - slot-18
          - slot-19
    env:
      GRID_SESSION_KEY: ${{ secrets.GRID_SESSION_KEY }}
      GRID_SLOT: ${{ matrix.slot }}
      GRID_MANIFEST_URL: ${{ inputs.manifest_url }}
      GRID_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
      GRID_BATCH_OPAQUE_ID: ${{ inputs.batch_opaque_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare and run
        id: run
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $stage = 'INIT'
          $code = 0
          $key = $null
          $opaqueId = ''
          $root = Join-Path $env:RUNNER_TEMP ('g_' + $env:GRID_SLOT)
          $payload = Join-Path $root 'p'
          $mt5 = Join-Path $root 't'
          $out = Join-Path $root 'o'
          $encIn = Join-Path $root 'i.bin'
          $encOut = Join-Path $env:RUNNER_TEMP ('o_' + $env:GRID_SLOT + '.bin')

          function Set-Stage([string]$NewStage, [int]$ExitCode = 1) {
            $script:stage = $NewStage
            $script:code = $ExitCode
            Write-Host "[GRID] $NewStage"
          }

          try {
            if ([string]::IsNullOrWhiteSpace($env:GRID_SESSION_KEY)) { Set-Stage 'SESSION_KEY_MISSING'; throw }
            if ($env:GRID_MANIFEST_SHA256 -notmatch '^[A-Fa-f0-9]{64}$') { Set-Stage 'MANIFEST_HASH_INVALID'; throw }
            if ([string]::IsNullOrWhiteSpace($env:GRID_MANIFEST_URL)) { Set-Stage 'MANIFEST_URL_MISSING'; throw }

            $key = $env:GRID_SESSION_KEY
            $seven = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
            if (-not (Test-Path $seven)) { Set-Stage 'ARCHIVER_UNAVAILABLE'; throw }

            New-Item -ItemType Directory -Force -Path $root,$payload,$mt5,$out | Out-Null

            # 1. Download and verify batch manifest
            $manifestPath = Join-Path $root 'manifest.json'
            try {
              Invoke-WebRequest -Uri $env:GRID_MANIFEST_URL -OutFile $manifestPath -UseBasicParsing
            } catch {
              Set-Stage 'MANIFEST_DOWNLOAD_FAILED'; throw
            }

            $actualManifestHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $manifestPath).Hash
            if (-not $actualManifestHash.Equals($env:GRID_MANIFEST_SHA256, [System.StringComparison]::OrdinalIgnoreCase)) {
              Set-Stage 'MANIFEST_HASH_MISMATCH'; throw
            }

            # 2. Parse and validate manifest schema
            try {
              $manifestRaw = Get-Content -LiteralPath $manifestPath -Raw -Encoding utf8
              $manifestJson = $manifestRaw | ConvertFrom-Json
            } catch {
              Set-Stage 'MANIFEST_PARSE_FAILED'; throw
            }

            if ($null -eq $manifestJson.slots -or $manifestJson.slots.Count -lt 1) {
              Set-Stage 'MANIFEST_EMPTY_OR_INVALID'; throw
            }

            $allSlots = @($manifestJson.slots | ForEach-Object { $_.slot })
            $allOpaques = @($manifestJson.slots | ForEach-Object { $_.opaque_id })
            if (($allSlots | Group-Object | Where-Object { $_.Count -gt 1 })) {
              Set-Stage 'MANIFEST_DUPLICATE_SLOT'; throw
            }
            if (($allOpaques | Group-Object | Where-Object { $_.Count -gt 1 })) {
              Set-Stage 'MANIFEST_DUPLICATE_OPAQUE_ID'; throw
            }

            # Find record for this slot
            $slotEntry = $manifestJson.slots | Where-Object { $_.slot -eq $env:GRID_SLOT } | Select-Object -First 1
            if ($null -eq $slotEntry) {
              Set-Stage 'MANIFEST_SLOT_NOT_FOUND'; throw
            }

            $pkgUrl = $slotEntry.package_url
            $pkgSha256 = $slotEntry.package_sha256
            $opaqueId = $slotEntry.opaque_id

            if ([string]::IsNullOrWhiteSpace($pkgUrl)) { Set-Stage 'PACKAGE_URL_MISSING'; throw }
            if ($pkgSha256 -notmatch '^[A-Fa-f0-9]{64}$') { Set-Stage 'PACKAGE_HASH_INVALID'; throw }
            if ([string]::IsNullOrWhiteSpace($opaqueId)) { Set-Stage 'OPAQUE_ID_MISSING'; throw }

            # 3. Download encrypted package for this slot
            Write-Host '[GRID] DOWNLOAD_BEGIN'
            try {
              Invoke-WebRequest -Uri $pkgUrl -OutFile $encIn -UseBasicParsing
            } catch {
              Set-Stage 'DOWNLOAD_FAILED'; throw
            }

            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $encIn).Hash
            if (-not $hash.Equals($pkgSha256, [System.StringComparison]::OrdinalIgnoreCase)) {
              Set-Stage 'HASH_MISMATCH'; throw
            }

            & $seven x $encIn "-p$key" "-o$payload" -y *> $null
            if ($LASTEXITCODE -ne 0) { Set-Stage 'DECRYPT_FAILED'; throw }

            $expert = Join-Path $payload 'worker.ex5'
            $config = Join-Path $payload 'tester.ini'
            $set = Join-Path $payload 'worker.set'
            if (-not (Test-Path $expert -PathType Leaf)) { Set-Stage 'EXPERT_MISSING'; throw }
            if (-not (Test-Path $config -PathType Leaf)) { Set-Stage 'CONFIG_MISSING'; throw }

            $payloadRoot = (Resolve-Path -LiteralPath $payload).Path
            $payloadDirs = @(Get-ChildItem -LiteralPath $payload -Directory -Recurse -Force -ErrorAction SilentlyContinue)
            if ($payloadDirs.Count -gt 0) { Set-Stage 'NESTED_PAYLOAD_NOT_ALLOWED'; throw }

            $payloadFiles = @(Get-ChildItem -LiteralPath $payload -File -Recurse -Force)
            $allowedNames = @('worker.ex5','tester.ini','worker.set')
            foreach ($file in $payloadFiles) {
              if ($file.DirectoryName -ne $payloadRoot) { Set-Stage 'NESTED_PAYLOAD_NOT_ALLOWED'; throw }
              if ($allowedNames -notcontains $file.Name) { Set-Stage 'PAYLOAD_FILE_NOT_ALLOWED'; throw }
            }
            if ($payloadFiles.Count -lt 2 -or $payloadFiles.Count -gt 3) { Set-Stage 'PAYLOAD_FILE_COUNT_INVALID'; throw }

            $cfg = Get-Content -LiteralPath $config -Raw
            if ($cfg -notmatch '(?im)^\s*AllowDllImport\s*=\s*0\s*$') { Set-Stage 'DLL_POLICY_INVALID'; throw }
            if ($cfg -match '(?im)^\s*Script\s*=') { Set-Stage 'SCRIPT_NOT_ALLOWED'; throw }
            if ($cfg -notmatch '(?im)^\s*Expert\s*=\s*worker(?:\.ex5)?\s*$') { Set-Stage 'EXPERT_NAME_INVALID'; throw }
            if ($cfg -notmatch '(?im)^\s*Optimization\s*=\s*0\s*$') { Set-Stage 'POC_REQUIRES_SINGLE_TEST'; throw }
            if ($cfg -notmatch '(?im)^\s*Report\s*=\s*report\s*$') { Set-Stage 'REPORT_NAME_INVALID'; throw }
            if ($cfg -notmatch '(?im)^\s*ReplaceReport\s*=\s*1\s*$') { Set-Stage 'REPLACE_REPORT_REQUIRED'; throw }
            if ($cfg -notmatch '(?im)^\s*ShutdownTerminal\s*=\s*1\s*$') { Set-Stage 'SHUTDOWN_REQUIRED'; throw }

            $hasSet = Test-Path -LiteralPath $set -PathType Leaf
            $declaresSet = $cfg -match '(?im)^\s*ExpertParameters\s*=\s*worker\.set\s*$'
            if ($hasSet -ne $declaresSet) { Set-Stage 'SET_CONTRACT_MISMATCH'; throw }

            Write-Host '[GRID] PAYLOAD_VERIFIED'

            $setup = Join-Path $root 's.exe'
            try { Invoke-WebRequest -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' -OutFile $setup -UseBasicParsing } catch { Set-Stage 'RUNTIME_DOWNLOAD_FAILED'; throw }
            Start-Process -FilePath $setup -ArgumentList '/auto' | Out-Null
            $defaultMt5 = Join-Path $env:ProgramFiles 'MetaTrader 5'
            $termDefault = Join-Path $defaultMt5 'terminal64.exe'
            $deadline = (Get-Date).AddMinutes(5)
            while (-not (Test-Path $termDefault -PathType Leaf) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 3 }
            Start-Sleep -Seconds 5
            Get-Process terminal64,s,mt5setup -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

            if (-not (Test-Path $termDefault -PathType Leaf)) { Set-Stage 'RUNTIME_MISSING'; throw }
            Copy-Item -Path "$defaultMt5\*" -Destination $mt5 -Recurse -Force
            $terminal = Join-Path $mt5 'terminal64.exe'
            if (-not (Test-Path $terminal -PathType Leaf)) { Set-Stage 'RUNTIME_MISSING'; throw }

            $expertDir = Join-Path $mt5 'MQL5\Experts'
            $testerDir = Join-Path $mt5 'MQL5\Profiles\Tester'
            $configDir = Join-Path $mt5 'Config'
            $scriptsDir = Join-Path $mt5 'MQL5\Scripts'
            $filesDir = Join-Path $mt5 'MQL5\Files'
            New-Item -ItemType Directory -Force -Path $expertDir,$testerDir,$configDir,$scriptsDir,$filesDir | Out-Null
            Copy-Item -LiteralPath $expert -Destination (Join-Path $expertDir 'worker.ex5') -Force
            if (Test-Path $set -PathType Leaf) { Copy-Item -LiteralPath $set -Destination (Join-Path $testerDir 'worker.set') -Force }


            Remove-Item Env:GRID_SESSION_KEY -ErrorAction SilentlyContinue

            # Compile generic prewarm script
            $prewarmMq5 = Join-Path $env:GITHUB_WORKSPACE 'runner\grid_prewarm.mq5'
            $targetMq5 = Join-Path $scriptsDir 'grid_prewarm.mq5'
            Copy-Item -LiteralPath $prewarmMq5 -Destination $targetMq5 -Force
            $metaeditor = Join-Path $mt5 'metaeditor64.exe'
            $compileLog = Join-Path $mt5 'compile_prewarm.log'
            Start-Process -FilePath $metaeditor -ArgumentList @("/compile:$targetMq5", "/log:$compileLog") -Wait | Out-Null
            if (-not (Test-Path (Join-Path $scriptsDir 'grid_prewarm.ex5') -PathType Leaf)) { Set-Stage 'PREWARM_COMPILE_FAILED'; throw }

            # Extract configuration from tester.ini
            $commonMatch = [regex]::Match($cfg, '(?ms)\[Common\].*?(?=\r?\n\[|\Z)')
            if (-not $commonMatch.Success) { Set-Stage 'CONFIG_INVALID'; throw }
            $commonSection = $commonMatch.Value

            $symbol = if ($cfg -match '(?im)^\s*Symbol\s*=\s*(\S+)') { $matches[1].Trim() } else { 'EURUSD' }
            $period = if ($cfg -match '(?im)^\s*Period\s*=\s*(\S+)') { $matches[1].Trim() } else { 'H1' }
            $fromDate = if ($cfg -match '(?im)^\s*FromDate\s*=\s*(\S+)') { $matches[1].Trim() } else { '' }
            $toDate = if ($cfg -match '(?im)^\s*ToDate\s*=\s*(\S+)') { $matches[1].Trim() } else { '' }
            $model = if ($cfg -match '(?im)^\s*Model\s*=\s*(\S+)') { $matches[1].Trim() } else { '1' }

            $paramContent = "FromDate=$fromDate`nToDate=$toDate`nModel=$model"
            Set-Content -LiteralPath (Join-Path $filesDir 'prewarm_params.txt') -Value $paramContent -Encoding ascii

            $prewarmIni = Join-Path $mt5 'prewarm.ini'
            $prewarmIniContent = "$commonSection`n`n[StartUp]`nScript=grid_prewarm`nSymbol=$symbol`nPeriod=$period`nShutdownTerminal=1`n"
            $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
            [System.IO.File]::WriteAllText($prewarmIni, $prewarmIniContent, $utf8NoBom)

            $prewarmBytes = [System.IO.File]::ReadAllBytes($prewarmIni)
            if ($prewarmBytes.Length -ge 3 -and $prewarmBytes[0] -eq 0xEF -and $prewarmBytes[1] -eq 0xBB -and $prewarmBytes[2] -eq 0xBF) {
              Set-Stage 'PREWARM_INI_BOM_INVALID'
              throw
            }
            Write-Host '[GRID] PREWARM_INI_ENCODING_OK'

            Write-Host '[GRID] PREWARM_BEGIN'
            $procPrewarm = Start-Process -FilePath $terminal -ArgumentList @('/portable',('/config:"'+$prewarmIni+'"')) -WorkingDirectory $mt5 -PassThru
            $swPrewarm = [System.Diagnostics.Stopwatch]::StartNew()
            while (-not $procPrewarm.HasExited) {
              Start-Sleep -Seconds 2
              if ($swPrewarm.Elapsed.TotalSeconds -ge 180) {
                Stop-Process -Id $procPrewarm.Id -Force -ErrorAction SilentlyContinue
                Set-Stage 'PREWARM_TIMEOUT'; throw
              }
            }

            # Wait for terminal64 to exit completely
            Get-Process terminal64 -ErrorAction SilentlyContinue | Wait-Process -Timeout 15 -ErrorAction SilentlyContinue
            Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

            # Validate grid_prewarm.status sentinel
            $statusPath = Join-Path $filesDir 'grid_prewarm.status'
            $prewarmStatusOk = $false
            if (Test-Path -LiteralPath $statusPath -PathType Leaf) {
              $stContent = Get-Content -LiteralPath $statusPath -Raw
              $stPass = ($stContent -match '(?im)^\s*STATUS\s*=\s*PASS\s*$')
              $m1Bars = if ($stContent -match '(?im)^\s*M1_BARS\s*=\s*(\d+)') { [int]$matches[1] } else { 0 }
              $tgtBars = if ($stContent -match '(?im)^\s*TARGET_BARS\s*=\s*(\d+)') { [int]$matches[1] } else { 0 }
              $ticksVal = if ($stContent -match '(?im)^\s*TICKS\s*=\s*(\d+)') { [int]$matches[1] } else { -1 }

              if ($stPass -and $m1Bars -gt 0 -and $tgtBars -gt 0) {
                if ($model -eq '2') {
                  if ($ticksVal -gt 0) { $prewarmStatusOk = $true }
                } else {
                  $prewarmStatusOk = $true
                }
              }
            }

            if (-not $prewarmStatusOk) {
              Set-Stage 'PREWARM_FAILED'; throw
            }
            Write-Host '[GRID] PREWARM_SUCCESS'

            # Check history cache presence in portable MT5
            $hcc = @(Get-ChildItem -Path (Join-Path $mt5 'bases') -Filter '*.hcc' -Recurse -File -ErrorAction SilentlyContinue)
            $hcs = @(Get-ChildItem -Path (Join-Path $mt5 'Tester') -Filter '*.hcs' -Recurse -File -ErrorAction SilentlyContinue)
            if ($hcc.Count -gt 0 -or $hcs.Count -gt 0) {
              Write-Host '[GRID] HISTORY_CACHE_PRESENT'
            } else {
              Write-Host '[GRID] HISTORY_CACHE_MISSING'
            }

            Remove-Item -LiteralPath $prewarmIni -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath (Join-Path $filesDir 'prewarm_params.txt') -Force -ErrorAction SilentlyContinue

            Write-Host '[GRID] EXECUTION_BEGIN'
            $proc = Start-Process -FilePath $terminal -ArgumentList @('/portable',('/config:"'+$config+'"')) -WorkingDirectory $mt5 -PassThru
            $swTester = [System.Diagnostics.Stopwatch]::StartNew()
            while (-not $proc.HasExited) {
              Start-Sleep -Seconds 2
              if ($swTester.Elapsed.TotalSeconds -ge 180) {
                Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
                Set-Stage 'TESTER_TIMEOUT'; throw
              }
            }
            $code = $proc.ExitCode

            Get-Process terminal64 -ErrorAction SilentlyContinue | Wait-Process -Timeout 15 -ErrorAction SilentlyContinue
            Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

            $reports = @(Get-ChildItem -LiteralPath $mt5 -File -Force -ErrorAction SilentlyContinue | Where-Object { $_.Name -like 'report*' })
            if ($code -eq 0 -and $reports.Count -eq 0) {
              $code = 97
            }

            # False-Positive Gate: Verify history and bars > 0
            $reportFile = Join-Path $mt5 'report.htm'
            $historyValid = $false
            if (Test-Path -LiteralPath $reportFile -PathType Leaf) {
              $htm = Get-Content -LiteralPath $reportFile -Raw
              $bars = 0
              if ($htm -match '<td[^>]*>Bars:</td>\s*<td[^>]*><b>(\d+)</b></td>') { $bars = [int]$matches[1] }
              if ($bars -gt 0 -and $htm -notmatch 'History Quality:\s*</td>\s*<td[^>]*><b>0%</b>') {
                $historyValid = $true
              }
            }
            $testerLogContent = Get-ChildItem -Path (Join-Path $mt5 'Tester') -Filter '*.log' -Recurse -ErrorAction SilentlyContinue | Get-Content -Raw -ErrorAction SilentlyContinue
            if ($testerLogContent -match 'cannot get history') {
              $historyValid = $false
            }

            if (-not $historyValid) {
              Set-Stage 'HISTORY_VALIDATION_FAILED', 96; throw
            }

            $stage = 'OK'
            $code = 0
          } catch {
            if ($stage -eq 'INIT' -or $stage -eq 'OK') { $stage = 'EXECUTION_FAILED' }
            if ($code -eq 0) { $code = 1 }
            Write-Host "[GRID] $stage"
          } finally {
            if (Test-Path -LiteralPath $mt5) {
              $sf = Join-Path $mt5 'MQL5\Files\grid_prewarm.status'
              if (Test-Path -LiteralPath $sf) { Copy-Item -LiteralPath $sf -Destination $out -Force }

              Get-ChildItem -Path $mt5 -Filter '*.log' -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
                $logName = $_.FullName.Substring($mt5.Length).TrimStart('\').Replace('\', '_')
                Copy-Item -LiteralPath $_.FullName -Destination (Join-Path $out $logName) -Force
              }

              $allReports = @(Get-ChildItem -LiteralPath $mt5 -File -Force -ErrorAction SilentlyContinue | Where-Object { $_.Name -like 'report*' })
              foreach ($r in $allReports) { Copy-Item -LiteralPath $r.FullName -Destination $out -Force }
            }

            Set-Content -LiteralPath (Join-Path $out 'slot.txt') -Value $env:GRID_SLOT -NoNewline -Encoding ascii
            Set-Content -LiteralPath (Join-Path $out 'opaque_id.txt') -Value $opaqueId -NoNewline -Encoding ascii
            Set-Content -LiteralPath (Join-Path $out 'stage.txt') -Value $stage -NoNewline -Encoding ascii
            Set-Content -LiteralPath (Join-Path $out 'exit.txt') -Value $code -NoNewline -Encoding ascii

            if (-not [string]::IsNullOrWhiteSpace($key) -and (Test-Path -LiteralPath $out)) {
              Push-Location $out
              try {
                & $seven a -t7z $encOut '.\*' "-p$key" -mhe=on -mx=7 *> $null
                if ($LASTEXITCODE -eq 0) {
                  Write-Host '[GRID] RESULT_READY'
                } else {
                  Write-Host '[GRID] RESULT_ENCRYPT_FAILED'
                }
              } finally { Pop-Location }
            }

            Remove-Item -LiteralPath $payload -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $mt5 -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $encIn -Force -ErrorAction SilentlyContinue
            $key = $null

            "exit_code=$code" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "stage=$stage" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

          if ($stage -ne 'OK' -or $code -ne 0) {
            exit 1
          }

      - name: Upload encrypted result
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: grid-${{ matrix.slot }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/o_${{ matrix.slot }}.bin
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 0

      - name: Final status
        if: always()
        shell: powershell
        env:
          CODE: ${{ steps.run.outputs.exit_code }}
          STAGE: ${{ steps.run.outputs.stage }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CODE) -or [int]$env:CODE -ne 0) {
            Write-Host "[GRID] FAILED (stage: $env:STAGE)"
            exit 1
          }
          Write-Host '[GRID] OK'

name: Capacity80

on:
  workflow_dispatch:
    inputs:
      package_url:
        description: "Opaque encrypted package URL"
        required: true
        type: string
      package_sha256:
        description: "SHA-256 of encrypted package"
        required: true
        type: string
      opaque_id:
        description: "Opaque identifier"
        required: true
        type: string

permissions:
  contents: read

jobs:
  canary:
    name: canary
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      GRID_SESSION_KEY: ${{ secrets.GRID_SESSION_KEY }}
      GRID_PACKAGE_URL: ${{ inputs.package_url }}
      GRID_PACKAGE_SHA256: ${{ inputs.package_sha256 }}
      GRID_OPAQUE_ID: ${{ inputs.opaque_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Canary preflight validation
        id: canary
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File ./runner/canary_node.ps1

  run:
    name: ${{ matrix.worker }}
    needs: canary
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        worker: [runner-00, runner-01, runner-02, runner-03, runner-04, runner-05, runner-06, runner-07, runner-08, runner-09, runner-10, runner-11, runner-12, runner-13, runner-14, runner-15, runner-16, runner-17, runner-18, runner-19]
    env:
      GRID_SESSION_KEY: ${{ secrets.GRID_SESSION_KEY }}
      GRID_PACKAGE_URL: ${{ inputs.package_url }}
      GRID_PACKAGE_SHA256: ${{ inputs.package_sha256 }}
      GRID_OPAQUE_ID: ${{ inputs.opaque_id }}
      WORKER_ID: ${{ matrix.worker }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Execute 4-slot runner batch
        id: run
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File ./runner/worker_node.ps1

      - name: Upload encrypted result
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: grid-80-${{ matrix.worker }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/o.bin
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 0

      - name: Final status
        if: always()
        shell: powershell
        env:
          CODE: ${{ steps.run.outputs.exit_code }}
          STAGE: ${{ steps.run.outputs.stage }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CODE) -or [int]$env:CODE -ne 0) {
            Write-Host "[GRID] FAILED (stage: $env:STAGE)"
            exit 1
          }
          Write-Host '[GRID] OK'

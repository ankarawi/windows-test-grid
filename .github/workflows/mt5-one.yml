name: One

on:
  workflow_dispatch:
    inputs:
      package_url:
        description: "Opaque encrypted package URL"
        required: true
        type: string
      package_sha256:
        description: "SHA-256 of encrypted package"
        required: true
        type: string
      opaque_id:
        description: "Opaque identifier"
        required: true
        type: string

permissions:
  contents: read

jobs:
  run:
    name: slot-00
    runs-on: windows-2022
    timeout-minutes: 330
    env:
      GRID_SESSION_KEY: ${{ secrets.GRID_SESSION_KEY }}
      GRID_PACKAGE_URL: ${{ inputs.package_url }}
      GRID_PACKAGE_SHA256: ${{ inputs.package_sha256 }}
    steps:
      - name: Prepare and run
        id: run
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          function Fail([string]$Code) {
            Write-Host "[GRID] $Code"
            exit 1
          }

          if ([string]::IsNullOrWhiteSpace($env:GRID_SESSION_KEY)) { Fail 'SESSION_KEY_MISSING' }
          if ($env:GRID_PACKAGE_SHA256 -notmatch '^[A-Fa-f0-9]{64}$') { Fail 'HASH_INVALID' }

          $key = $env:GRID_SESSION_KEY
          $seven = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
          if (-not (Test-Path $seven)) { Fail 'ARCHIVER_UNAVAILABLE' }

          $root = Join-Path $env:RUNNER_TEMP 'g'
          $payload = Join-Path $root 'p'
          $mt5 = Join-Path $root 't'
          $out = Join-Path $root 'o'
          $encIn = Join-Path $root 'i.bin'
          $encOut = Join-Path $env:RUNNER_TEMP 'o.bin'
          New-Item -ItemType Directory -Force -Path $root,$payload,$mt5,$out | Out-Null

          Write-Host '[GRID] DOWNLOAD_BEGIN'
          try { Invoke-WebRequest -Uri $env:GRID_PACKAGE_URL -OutFile $encIn -UseBasicParsing } catch { Fail 'DOWNLOAD_FAILED' }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $encIn).Hash
          if (-not $hash.Equals($env:GRID_PACKAGE_SHA256,[System.StringComparison]::OrdinalIgnoreCase)) { Fail 'HASH_MISMATCH' }

          & $seven x $encIn "-p$key" "-o$payload" -y *> $null
          if ($LASTEXITCODE -ne 0) { Fail 'DECRYPT_FAILED' }

          $expert = Join-Path $payload 'worker.ex5'
          $config = Join-Path $payload 'tester.ini'
          $set = Join-Path $payload 'worker.set'
          if (-not (Test-Path $expert -PathType Leaf)) { Fail 'EXPERT_MISSING' }
          if (-not (Test-Path $config -PathType Leaf)) { Fail 'CONFIG_MISSING' }

          $payloadRoot = (Resolve-Path -LiteralPath $payload).Path
          $payloadDirs = @(Get-ChildItem -LiteralPath $payload -Directory -Recurse -Force -ErrorAction SilentlyContinue)
          if ($payloadDirs.Count -gt 0) { Fail 'NESTED_PAYLOAD_NOT_ALLOWED' }

          $payloadFiles = @(Get-ChildItem -LiteralPath $payload -File -Recurse -Force)
          $allowedNames = @('worker.ex5','tester.ini','worker.set')
          foreach ($file in $payloadFiles) {
            if ($file.DirectoryName -ne $payloadRoot) { Fail 'NESTED_PAYLOAD_NOT_ALLOWED' }
            if ($allowedNames -notcontains $file.Name) { Fail 'PAYLOAD_FILE_NOT_ALLOWED' }
          }
          if ($payloadFiles.Count -lt 2 -or $payloadFiles.Count -gt 3) { Fail 'PAYLOAD_FILE_COUNT_INVALID' }

          $cfg = Get-Content -LiteralPath $config -Raw
          if ($cfg -notmatch '(?im)^\s*AllowDllImport\s*=\s*0\s*$') { Fail 'DLL_POLICY_INVALID' }
          if ($cfg -match '(?im)^\s*Script\s*=') { Fail 'SCRIPT_NOT_ALLOWED' }
          if ($cfg -notmatch '(?im)^\s*Expert\s*=\s*worker(?:\.ex5)?\s*$') { Fail 'EXPERT_NAME_INVALID' }
          if ($cfg -notmatch '(?im)^\s*Optimization\s*=\s*0\s*$') { Fail 'POC_REQUIRES_SINGLE_TEST' }
          if ($cfg -notmatch '(?im)^\s*Report\s*=\s*report\s*$') { Fail 'REPORT_NAME_INVALID' }
          if ($cfg -notmatch '(?im)^\s*ReplaceReport\s*=\s*1\s*$') { Fail 'REPLACE_REPORT_REQUIRED' }
          if ($cfg -notmatch '(?im)^\s*ShutdownTerminal\s*=\s*1\s*$') { Fail 'SHUTDOWN_REQUIRED' }

          $hasSet = Test-Path -LiteralPath $set -PathType Leaf
          $declaresSet = $cfg -match '(?im)^\s*ExpertParameters\s*=\s*worker\.set\s*$'
          if ($hasSet -ne $declaresSet) { Fail 'SET_CONTRACT_MISMATCH' }

          Write-Host '[GRID] PAYLOAD_VERIFIED'

          $setup = Join-Path $root 's.exe'
          try { Invoke-WebRequest -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' -OutFile $setup -UseBasicParsing } catch { Fail 'RUNTIME_DOWNLOAD_FAILED' }
          Start-Process -FilePath $setup -ArgumentList '/auto' | Out-Null
          $defaultMt5 = Join-Path $env:ProgramFiles 'MetaTrader 5'
          $termDefault = Join-Path $defaultMt5 'terminal64.exe'
          $deadline = (Get-Date).AddMinutes(5)
          while (-not (Test-Path $termDefault -PathType Leaf) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 3 }
          Start-Sleep -Seconds 5
          Get-Process terminal64,s,mt5setup -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

          if (-not (Test-Path $termDefault -PathType Leaf)) { Fail 'RUNTIME_MISSING' }
          Copy-Item -Path "$defaultMt5\*" -Destination $mt5 -Recurse -Force
          $terminal = Join-Path $mt5 'terminal64.exe'
          if (-not (Test-Path $terminal -PathType Leaf)) { Fail 'RUNTIME_MISSING' }

          $expertDir = Join-Path $mt5 'MQL5\Experts'
          $testerDir = Join-Path $mt5 'MQL5\Profiles\Tester'
          New-Item -ItemType Directory -Force -Path $expertDir,$testerDir | Out-Null
          Copy-Item -LiteralPath $expert -Destination (Join-Path $expertDir 'worker.ex5') -Force
          if (Test-Path $set -PathType Leaf) { Copy-Item -LiteralPath $set -Destination (Join-Path $testerDir 'worker.set') -Force }

          Remove-Item Env:GRID_SESSION_KEY -ErrorAction SilentlyContinue

          Write-Host '[GRID] MARKET_PREWARM_BEGIN'
          $prewarmScript = Join-Path $root 'prewarm.py'
          @'
import sys, time, configparser
from datetime import datetime, timezone

ini_path = sys.argv[1]
term_path = sys.argv[2]

config = configparser.ConfigParser(strict=False)
config.read(ini_path, encoding='ascii')

login = int(config.get('Common', 'Login'))
password = config.get('Common', 'Password')
server = config.get('Common', 'Server')
symbol = config.get('Tester', 'Symbol')
period_str = config.get('Tester', 'Period')
from_str = config.get('Tester', 'FromDate')
to_str = config.get('Tester', 'ToDate')

import MetaTrader5 as mt5

timeframe_map = {
    'M1': mt5.TIMEFRAME_M1, 'M2': mt5.TIMEFRAME_M2, 'M3': mt5.TIMEFRAME_M3,
    'M4': mt5.TIMEFRAME_M4, 'M5': mt5.TIMEFRAME_M5, 'M6': mt5.TIMEFRAME_M6,
    'M10': mt5.TIMEFRAME_M10, 'M12': mt5.TIMEFRAME_M12, 'M15': mt5.TIMEFRAME_M15,
    'M20': mt5.TIMEFRAME_M20, 'M30': mt5.TIMEFRAME_M30, 'H1': mt5.TIMEFRAME_H1,
    'H2': mt5.TIMEFRAME_H2, 'H3': mt5.TIMEFRAME_H3, 'H4': mt5.TIMEFRAME_H4,
    'H6': mt5.TIMEFRAME_H6, 'H8': mt5.TIMEFRAME_H8, 'H12': mt5.TIMEFRAME_H12,
    'D1': mt5.TIMEFRAME_D1, 'W1': mt5.TIMEFRAME_W1, 'MN1': mt5.TIMEFRAME_MN1
}
tf = timeframe_map.get(period_str.upper(), mt5.TIMEFRAME_H1)
dt_from = datetime.strptime(from_str, "%Y.%m.%d").replace(tzinfo=timezone.utc)
dt_to = datetime.strptime(to_str, "%Y.%m.%d").replace(tzinfo=timezone.utc)

init_ok = mt5.initialize(path=term_path, portable=True, timeout=60000)
if not init_ok:
    init_ok = mt5.initialize(path=term_path, timeout=60000)
if not init_ok:
    sys.exit(2)

print("[GRID] TERMINAL_CONNECTED")

if not mt5.login(login, password=password, server=server):
    mt5.shutdown()
    sys.exit(3)

print("[GRID] AUTH_SUCCESS")

if not mt5.symbol_select(symbol, True):
    mt5.shutdown()
    sys.exit(4)

print("[GRID] SYMBOL_SELECTED")
print("[GRID] HISTORY_SYNC_BEGIN")

bars_synced = 0
for attempt in range(1, 31):
    mt5.symbol_info_tick(symbol)
    mt5.copy_rates_from_pos(symbol, mt5.TIMEFRAME_M1, 0, 100)
    rates = mt5.copy_rates_range(symbol, tf, dt_from, dt_to)
    if rates is not None and len(rates) > 0:
        bars_synced = len(rates)
        break
    time.sleep(2)

mt5.shutdown()

if bars_synced > 0:
    print(f"[GRID] HISTORY_READY: BARS={bars_synced}")
    sys.exit(0)
else:
    sys.exit(5)
'@ | Set-Content -LiteralPath $prewarmScript -Encoding utf8

          pip install --quiet MetaTrader5==5.0.6180
          python $prewarmScript $config $terminal
          $pyPrewarmExit = $LASTEXITCODE
          Remove-Item -LiteralPath $prewarmScript -Force -ErrorAction SilentlyContinue

          if ($pyPrewarmExit -ne 0) {
              Write-Host '[GRID] NATIVE_PREWARM_BEGIN'
              $preProc = Start-Process -FilePath $terminal -ArgumentList @('/portable',('/config:"'+$config+'"')) -WorkingDirectory $mt5 -PassThru
              $deadline = (Get-Date).AddSeconds(45)
              $historyReady = $false
              while ((Get-Date) -lt $deadline) {
                  Start-Sleep -Seconds 3
                  $hcc = Get-ChildItem (Join-Path $mt5 'Bases') -Recurse -Filter '*.hcc' -ErrorAction SilentlyContinue
                  if ($hcc -and ($hcc | Where-Object { $_.Length -gt 1000 })) {
                      $historyReady = $true
                      break
                  }
              }
              Stop-Process -Id $preProc.Id -Force -ErrorAction SilentlyContinue
              Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
              if ($historyReady) {
                  Write-Host '[GRID] HISTORY_READY'
              } else {
                  Write-Host '[GRID] HISTORY_PREWARM_FAILED'
              }
          }

          Write-Host '[GRID] EXECUTION_BEGIN'
          $proc = Start-Process -FilePath $terminal -ArgumentList @('/portable',('/config:"'+$config+'"')) -WorkingDirectory $mt5 -Wait -PassThru
          $code = $proc.ExitCode

          $reports = @(Get-ChildItem -LiteralPath $mt5 -File -Force -ErrorAction SilentlyContinue | Where-Object { $_.Name -like 'report*' })
          foreach ($r in $reports) { Copy-Item -LiteralPath $r.FullName -Destination $out -Force }
          Set-Content -LiteralPath (Join-Path $out 'exit.txt') -Value $code -NoNewline -Encoding ascii

          if ($code -eq 0 -and $reports.Count -eq 0) { $code = 97; Set-Content -LiteralPath (Join-Path $out 'exit.txt') -Value $code -NoNewline -Encoding ascii }

          Push-Location $out
          try {
            & $seven a -t7z $encOut '.\*' "-p$key" -mhe=on -mx=7 *> $null
            if ($LASTEXITCODE -ne 0) { Fail 'RESULT_ENCRYPT_FAILED' }
          } finally { Pop-Location }

          Remove-Item -LiteralPath $payload -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $mt5 -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $encIn -Force -ErrorAction SilentlyContinue
          $key = $null
          Write-Host '[GRID] RESULT_READY'
          "exit_code=$code" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload encrypted result
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: grid-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/o.bin
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 0

      - name: Final status
        if: always()
        shell: powershell
        env:
          CODE: ${{ steps.run.outputs.exit_code }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CODE)) { Write-Host '[GRID] FAILED'; exit 1 }
          if ([int]$env:CODE -ne 0) { Write-Host '[GRID] FAILED'; exit 1 }
          Write-Host '[GRID] OK'

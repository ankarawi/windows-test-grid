name: One

on:
  workflow_dispatch:
    inputs:
      package_url:
        description: "Opaque encrypted package URL"
        required: true
        type: string
      package_sha256:
        description: "SHA-256 of encrypted package"
        required: true
        type: string
      opaque_id:
        description: "Opaque identifier"
        required: true
        type: string

permissions:
  contents: read

jobs:
  run:
    name: slot-00
    runs-on: windows-2022
    timeout-minutes: 330
    env:
      GRID_SESSION_KEY: ${{ secrets.GRID_SESSION_KEY }}
      GRID_PACKAGE_URL: ${{ inputs.package_url }}
      GRID_PACKAGE_SHA256: ${{ inputs.package_sha256 }}
    steps:
      - name: Prepare and run
        id: run
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          function Fail([string]$Code) {
            Write-Host "[GRID] $Code"
            exit 1
          }

          if ([string]::IsNullOrWhiteSpace($env:GRID_SESSION_KEY)) { Fail 'SESSION_KEY_MISSING' }
          if ($env:GRID_PACKAGE_SHA256 -notmatch '^[A-Fa-f0-9]{64}$') { Fail 'HASH_INVALID' }

          $key = $env:GRID_SESSION_KEY
          $seven = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
          if (-not (Test-Path $seven)) { Fail 'ARCHIVER_UNAVAILABLE' }

          $root = Join-Path $env:RUNNER_TEMP 'g'
          $payload = Join-Path $root 'p'
          $mt5 = Join-Path $root 't'
          $out = Join-Path $root 'o'
          $encIn = Join-Path $root 'i.bin'
          $encOut = Join-Path $env:RUNNER_TEMP 'o.bin'
          New-Item -ItemType Directory -Force -Path $root,$payload,$mt5,$out | Out-Null

          Write-Host '[GRID] DOWNLOAD_BEGIN'
          try { Invoke-WebRequest -Uri $env:GRID_PACKAGE_URL -OutFile $encIn -UseBasicParsing } catch { Fail 'DOWNLOAD_FAILED' }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $encIn).Hash
          if (-not $hash.Equals($env:GRID_PACKAGE_SHA256,[System.StringComparison]::OrdinalIgnoreCase)) { Fail 'HASH_MISMATCH' }

          & $seven x $encIn "-p$key" "-o$payload" -y *> $null
          if ($LASTEXITCODE -ne 0) { Fail 'DECRYPT_FAILED' }

          $expert = Join-Path $payload 'worker.ex5'
          $config = Join-Path $payload 'tester.ini'
          $set = Join-Path $payload 'worker.set'
          if (-not (Test-Path $expert -PathType Leaf)) { Fail 'EXPERT_MISSING' }
          if (-not (Test-Path $config -PathType Leaf)) { Fail 'CONFIG_MISSING' }

          $forbidden = Get-ChildItem -LiteralPath $payload -File -Recurse -Force | Where-Object { $_.Extension -in '.dll','.exe','.bat','.cmd','.ps1','.vbs','.js','.msi' }
          if ($forbidden.Count -gt 0) { Fail 'PAYLOAD_TYPE_REJECTED' }

          $cfg = Get-Content -LiteralPath $config -Raw
          if ($cfg -match '(?im)^\s*AllowDllImport\s*=\s*1\s*$') { Fail 'DLL_NOT_ALLOWED' }
          if ($cfg -match '(?im)^\s*Script\s*=') { Fail 'SCRIPT_NOT_ALLOWED' }
          if ($cfg -notmatch '(?im)^\s*Expert\s*=\s*worker(?:\.ex5)?\s*$') { Fail 'EXPERT_NAME_INVALID' }
          if ($cfg -notmatch '(?im)^\s*Report\s*=\s*report\s*$') { Fail 'REPORT_NAME_INVALID' }
          if ($cfg -notmatch '(?im)^\s*ShutdownTerminal\s*=\s*1\s*$') { Fail 'SHUTDOWN_REQUIRED' }

          Write-Host '[GRID] PAYLOAD_VERIFIED'

          $setup = Join-Path $root 's.exe'
          try { Invoke-WebRequest -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' -OutFile $setup -UseBasicParsing } catch { Fail 'RUNTIME_DOWNLOAD_FAILED' }
          $install = Start-Process -FilePath $setup -ArgumentList @('/auto',('/path:"'+$mt5+'"')) -Wait -PassThru
          if ($install.ExitCode -ne 0) { Fail 'RUNTIME_INSTALL_FAILED' }

          Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $terminal = Join-Path $mt5 'terminal64.exe'
          if (-not (Test-Path $terminal -PathType Leaf)) { Fail 'RUNTIME_MISSING' }

          $expertDir = Join-Path $mt5 'MQL5\Experts'
          $testerDir = Join-Path $mt5 'MQL5\Profiles\Tester'
          New-Item -ItemType Directory -Force -Path $expertDir,$testerDir | Out-Null
          Copy-Item -LiteralPath $expert -Destination (Join-Path $expertDir 'worker.ex5') -Force
          if (Test-Path $set -PathType Leaf) { Copy-Item -LiteralPath $set -Destination (Join-Path $testerDir 'worker.set') -Force }

          Remove-Item Env:GRID_SESSION_KEY -ErrorAction SilentlyContinue
          Write-Host '[GRID] EXECUTION_BEGIN'
          $proc = Start-Process -FilePath $terminal -ArgumentList @('/portable',('/config:"'+$config+'"')) -WorkingDirectory $mt5 -Wait -PassThru
          $code = $proc.ExitCode

          $reports = @(Get-ChildItem -LiteralPath $mt5 -File -Force -ErrorAction SilentlyContinue | Where-Object { $_.Name -like 'report*' })
          foreach ($r in $reports) { Copy-Item -LiteralPath $r.FullName -Destination $out -Force }
          Set-Content -LiteralPath (Join-Path $out 'exit.txt') -Value $code -NoNewline -Encoding ascii

          if ($code -eq 0 -and $reports.Count -eq 0) { $code = 97; Set-Content -LiteralPath (Join-Path $out 'exit.txt') -Value $code -NoNewline -Encoding ascii }

          Push-Location $out
          try {
            & $seven a -t7z $encOut '.\*' "-p$key" -mhe=on -mx=7 *> $null
            if ($LASTEXITCODE -ne 0) { Fail 'RESULT_ENCRYPT_FAILED' }
          } finally { Pop-Location }

          Remove-Item -LiteralPath $payload -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $mt5 -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $encIn -Force -ErrorAction SilentlyContinue
          $key = $null
          Write-Host '[GRID] RESULT_READY'
          "exit_code=$code" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload encrypted result
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: grid-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/o.bin
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 0

      - name: Final status
        if: always()
        shell: powershell
        env:
          CODE: ${{ steps.run.outputs.exit_code }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CODE)) { Write-Host '[GRID] FAILED'; exit 1 }
          if ([int]$env:CODE -ne 0) { Write-Host '[GRID] FAILED'; exit 1 }
          Write-Host '[GRID] OK'

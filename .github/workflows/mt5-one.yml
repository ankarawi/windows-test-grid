name: Capacity

on:
  workflow_dispatch:
    inputs:
      package_url:
        description: "Opaque encrypted package URL"
        required: true
        type: string
      package_sha256:
        description: "SHA-256 of encrypted package"
        required: true
        type: string
      opaque_id:
        description: "Opaque identifier"
        required: true
        type: string

permissions:
  contents: read

jobs:
  run:
    name: worker
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      GRID_SESSION_KEY: ${{ secrets.GRID_SESSION_KEY }}
      GRID_PACKAGE_URL: ${{ inputs.package_url }}
      GRID_PACKAGE_SHA256: ${{ inputs.package_sha256 }}
      GRID_OPAQUE_ID: ${{ inputs.opaque_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare and run
        id: run
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $stage = 'INIT'
          $code = 0
          $key = $null
          $root = Join-Path $env:RUNNER_TEMP 'g'
          $payload = Join-Path $root 'p'
          $mt5 = Join-Path $root 't'
          $out = Join-Path $root 'o'
          $encIn = Join-Path $root 'i.7z'
          $encOut = Join-Path $env:RUNNER_TEMP 'o.bin'

          function Set-Stage([string]$s, [int]$c = 1) {
            $script:stage = $s
            $script:code = $c
          }

          try {
            if ([string]::IsNullOrWhiteSpace($env:GRID_SESSION_KEY)) { Set-Stage 'SESSION_KEY_MISSING'; throw }
            if ($env:GRID_PACKAGE_SHA256 -notmatch '^[A-Fa-f0-9]{64}$') { Set-Stage 'HASH_INVALID'; throw }
            if ([string]::IsNullOrWhiteSpace($env:GRID_PACKAGE_URL)) { Set-Stage 'URL_MISSING'; throw }

            $key = $env:GRID_SESSION_KEY
            $seven = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
            if (-not (Test-Path $seven -PathType Leaf)) { Set-Stage 'SEVENZIP_MISSING'; throw }

            New-Item -ItemType Directory -Force -Path $root,$payload,$mt5,$out | Out-Null

            # Hardware specs audit
            $cs = Get-CimInstance Win32_ComputerSystem
            $proc = Get-CimInstance Win32_Processor | Select-Object -First 1
            $logicalCpus = $cs.NumberOfLogicalProcessors
            $physicalCores = if ($proc.NumberOfCores) { $proc.NumberOfCores } else { "UNKNOWN" }
            $totalRamGb = [math]::Round($cs.TotalPhysicalMemory / 1GB, 1)
            $cpuModel = $proc.Name.Trim()

            Write-Host "[GRID] HARDWARE_AUDIT"
            Write-Host "WORKER_LOGICAL_CPUS=$logicalCpus"
            Write-Host "WORKER_PHYSICAL_CORES=$physicalCores"
            Write-Host "WORKER_RAM_GB=$totalRamGb"
            Write-Host "WORKER_CPU_MODEL=$cpuModel"

            # Download encrypted package
            Write-Host '[GRID] DOWNLOAD_BEGIN'
            try { Invoke-WebRequest -Uri $env:GRID_PACKAGE_URL -OutFile $encIn -UseBasicParsing } catch { Set-Stage 'DOWNLOAD_FAILED'; throw }
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $encIn).Hash
            if (-not $hash.Equals($env:GRID_PACKAGE_SHA256, [System.StringComparison]::OrdinalIgnoreCase)) { Set-Stage 'HASH_MISMATCH'; throw }

            & $seven x $encIn "-p$key" "-o$payload" -y *> $null
            if ($LASTEXITCODE -ne 0) { Set-Stage 'DECRYPT_FAILED'; throw }

            $expert = Join-Path $payload 'worker.ex5'
            $config = Join-Path $payload 'tester.ini'
            $set = Join-Path $payload 'worker.set'
            if (-not (Test-Path $expert -PathType Leaf)) { Set-Stage 'PAYLOAD_INVALID'; throw }
            if (-not (Test-Path $config -PathType Leaf)) { Set-Stage 'PAYLOAD_INVALID'; throw }

            $allowedNames = @('worker.ex5','tester.ini','worker.set')
            $foundNames = @(Get-ChildItem -LiteralPath $payload -File | ForEach-Object { $_.Name.ToLowerInvariant() })
            foreach ($fn in $foundNames) {
              if ($allowedNames -notcontains $fn) {
                Set-Stage 'UNEXPECTED_PAYLOAD_FILE'; throw
              }
            }

            $cfg = Get-Content -LiteralPath $config -Raw -Encoding utf8
            if ($cfg -notmatch '(?im)^\s*Expert\s*=\s*worker(\.ex5)?\s*$') { Set-Stage 'PAYLOAD_INVALID'; throw }
            if ($cfg -notmatch '(?im)^\s*ShutdownTerminal\s*=\s*1\s*$') { Set-Stage 'PAYLOAD_INVALID'; throw }
            if ($cfg -notmatch '(?im)^\s*Server\s*=') { Set-Stage 'ENDPOINT_MISSING'; throw }

            Write-Host '[GRID] PAYLOAD_VERIFIED'

            # Install MT5 runtime
            $setup = Join-Path $root 's.exe'
            try { Invoke-WebRequest -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' -OutFile $setup -UseBasicParsing } catch { Set-Stage 'RUNTIME_DOWNLOAD_FAILED'; throw }
            Start-Process -FilePath $setup -ArgumentList '/auto' | Out-Null
            $defaultMt5 = Join-Path $env:ProgramFiles 'MetaTrader 5'
            $termDefault = Join-Path $defaultMt5 'terminal64.exe'
            $deadline = (Get-Date).AddMinutes(5)
            while (-not (Test-Path $termDefault -PathType Leaf) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 3 }
            Start-Sleep -Seconds 5
            Get-Process terminal64,metatester64,s,mt5setup -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

            if (-not (Test-Path $termDefault -PathType Leaf)) { Set-Stage 'RUNTIME_MISSING'; throw }
            Copy-Item -Path "$defaultMt5\*" -Destination $mt5 -Recurse -Force
            $terminal = Join-Path $mt5 'terminal64.exe'
            if (-not (Test-Path $terminal -PathType Leaf)) { Set-Stage 'RUNTIME_MISSING'; throw }

            $expertDir = Join-Path $mt5 'MQL5\Experts'
            $testerDir = Join-Path $mt5 'MQL5\Profiles\Tester'
            $configDir = Join-Path $mt5 'Config'
            $scriptsDir = Join-Path $mt5 'MQL5\Scripts'
            $filesDir = Join-Path $mt5 'MQL5\Files'
            New-Item -ItemType Directory -Force -Path $expertDir,$testerDir,$configDir,$scriptsDir,$filesDir | Out-Null
            Copy-Item -LiteralPath $expert -Destination (Join-Path $expertDir 'worker.ex5') -Force
            if (Test-Path $set -PathType Leaf) { Copy-Item -LiteralPath $set -Destination (Join-Path $testerDir 'worker.set') -Force }

            Remove-Item Env:GRID_SESSION_KEY -ErrorAction SilentlyContinue

            # Compile generic prewarm script
            $prewarmMq5 = Join-Path $env:GITHUB_WORKSPACE 'runner\grid_prewarm.mq5'
            $targetMq5 = Join-Path $scriptsDir 'grid_prewarm.mq5'
            Copy-Item -LiteralPath $prewarmMq5 -Destination $targetMq5 -Force
            $metaeditor = Join-Path $mt5 'metaeditor64.exe'
            $compileLog = Join-Path $mt5 'compile_prewarm.log'
            Start-Process -FilePath $metaeditor -ArgumentList @("/compile:$targetMq5", "/log:$compileLog") -Wait | Out-Null
            if (-not (Test-Path (Join-Path $scriptsDir 'grid_prewarm.ex5') -PathType Leaf)) { Set-Stage 'PREWARM_COMPILE_FAILED'; throw }

            # Extract configuration from tester.ini
            $commonMatch = [regex]::Match($cfg, '(?ms)\[Common\].*?(?=\r?\n\[|\Z)')
            if (-not $commonMatch.Success) { Set-Stage 'CONFIG_INVALID'; throw }
            $commonSection = $commonMatch.Value

            $symbol = if ($cfg -match '(?im)^\s*Symbol\s*=\s*(\S+)') { $matches[1].Trim() } else { 'EURUSD' }
            $period = if ($cfg -match '(?im)^\s*Period\s*=\s*(\S+)') { $matches[1].Trim() } else { 'H1' }
            $fromDate = if ($cfg -match '(?im)^\s*FromDate\s*=\s*(\S+)') { $matches[1].Trim() } else { '' }
            $toDate = if ($cfg -match '(?im)^\s*ToDate\s*=\s*(\S+)') { $matches[1].Trim() } else { '' }
            $model = if ($cfg -match '(?im)^\s*Model\s*=\s*(\S+)') { $matches[1].Trim() } else { '1' }

            $paramContent = "FromDate=$fromDate`nToDate=$toDate`nModel=$model"
            Set-Content -LiteralPath (Join-Path $filesDir 'prewarm_params.txt') -Value $paramContent -Encoding ascii

            # PHASE A: BOM FIX & ASSERTION
            $prewarmIni = Join-Path $mt5 'prewarm.ini'
            $prewarmIniContent = "$commonSection`n`n[StartUp]`nScript=grid_prewarm`nSymbol=$symbol`nPeriod=$period`nShutdownTerminal=1`n"
            $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
            [System.IO.File]::WriteAllText($prewarmIni, $prewarmIniContent, $utf8NoBom)

            $prewarmBytes = [System.IO.File]::ReadAllBytes($prewarmIni)
            if ($prewarmBytes.Length -ge 3 -and $prewarmBytes[0] -eq 0xEF -and $prewarmBytes[1] -eq 0xBB -and $prewarmBytes[2] -eq 0xBF) {
              Set-Stage 'PREWARM_INI_BOM_INVALID'
              throw
            }
            Write-Host '[GRID] PREWARM_INI_ENCODING_OK'

            # Run Prewarm
            Write-Host '[GRID] PREWARM_BEGIN'
            $procPrewarm = Start-Process -FilePath $terminal -ArgumentList @('/portable',('/config:"'+$prewarmIni+'"')) -WorkingDirectory $mt5 -PassThru
            $swPrewarm = [System.Diagnostics.Stopwatch]::StartNew()
            while (-not $procPrewarm.HasExited) {
              Start-Sleep -Seconds 2
              if ($swPrewarm.Elapsed.TotalSeconds -ge 180) {
                Stop-Process -Id $procPrewarm.Id -Force -ErrorAction SilentlyContinue
                Set-Stage 'PREWARM_TIMEOUT'; throw
              }
            }

            Get-Process terminal64,metatester64 -ErrorAction SilentlyContinue | Wait-Process -Timeout 15 -ErrorAction SilentlyContinue
            Get-Process terminal64,metatester64 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

            # Validate grid_prewarm.status sentinel
            $statusPath = Join-Path $filesDir 'grid_prewarm.status'
            $prewarmStatusOk = $false
            if (Test-Path -LiteralPath $statusPath -PathType Leaf) {
              $stContent = Get-Content -LiteralPath $statusPath -Raw
              $stPass = ($stContent -match '(?im)^\s*STATUS\s*=\s*PASS\s*$')
              $m1Bars = if ($stContent -match '(?im)^\s*M1_BARS\s*=\s*(\d+)') { [int]$matches[1] } else { 0 }
              $tgtBars = if ($stContent -match '(?im)^\s*TARGET_BARS\s*=\s*(\d+)') { [int]$matches[1] } else { 0 }
              $ticksVal = if ($stContent -match '(?im)^\s*TICKS\s*=\s*(\d+)') { [int]$matches[1] } else { -1 }

              if ($stPass -and $m1Bars -gt 0 -and $tgtBars -gt 0) {
                if ($model -eq '2') {
                  if ($ticksVal -gt 0) { $prewarmStatusOk = $true }
                } else {
                  $prewarmStatusOk = $true
                }
              }
            }

            if (-not $prewarmStatusOk) {
              Set-Stage 'PREWARM_FAILED'; throw
            }
            Write-Host '[GRID] PREWARM_SUCCESS'

            # Check history cache presence
            $hcc = @(Get-ChildItem -Path (Join-Path $mt5 'bases') -Filter '*.hcc' -Recurse -File -ErrorAction SilentlyContinue)
            $hcs = @(Get-ChildItem -Path (Join-Path $mt5 'Tester') -Filter '*.hcs' -Recurse -File -ErrorAction SilentlyContinue)
            if ($hcc.Count -gt 0 -or $hcs.Count -gt 0) {
              Write-Host '[GRID] HISTORY_CACHE_PRESENT'
            } else {
              Write-Host '[GRID] HISTORY_CACHE_MISSING'
            }

            Remove-Item -LiteralPath $prewarmIni -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath (Join-Path $filesDir 'prewarm_params.txt') -Force -ErrorAction SilentlyContinue

            Copy-Item -LiteralPath $config -Destination (Join-Path $mt5 'tester.ini') -Force

            # Clean helper to clone pristine MT5 portable environment
            function Clone-Mt5Environment([string]$sourceBase, [string]$sourceMt5, [string]$targetDir, [string]$iniPath) {
              New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
              Copy-Item -Path "$sourceBase\*" -Destination $targetDir -Recurse -Force

              $mql5Src = Join-Path $sourceMt5 'MQL5'
              if (Test-Path $mql5Src) {
                Copy-Item -Path $mql5Src -Destination (Join-Path $targetDir 'MQL5') -Recurse -Force
              }

              $basesSrc = Join-Path $sourceMt5 'bases'
              if (Test-Path $basesSrc) {
                Copy-Item -Path $basesSrc -Destination (Join-Path $targetDir 'bases') -Recurse -Force
              }

              $testerBasesSrc = Join-Path $sourceMt5 'Tester\bases'
              if (Test-Path $testerBasesSrc) {
                $targetTester = Join-Path $targetDir 'Tester'
                New-Item -ItemType Directory -Force -Path $targetTester | Out-Null
                Copy-Item -Path $testerBasesSrc -Destination (Join-Path $targetTester 'bases') -Recurse -Force
              }

              Copy-Item -LiteralPath $iniPath -Destination (Join-Path $targetDir 'tester.ini') -Force
            }

            # Benchmark execution harness
            function Run-ParallelBenchmark([string[]]$mt5Dirs, [string]$testName, [int]$timeoutSec = 180) {
              $pcCpu = New-Object System.Diagnostics.PerformanceCounter("Processor", "% Processor Time", "_Total")
              $pcRam = New-Object System.Diagnostics.PerformanceCounter("Memory", "Available MBytes")
              [void]$pcCpu.NextValue()
              $totRamMb = (Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1MB

              $mCpu = 0.0
              $mRam = 0.0

              Write-Host "[GRID] ${testName}_BEGIN (Instances: $($mt5Dirs.Count))"

              $procs = @()
              foreach ($d in $mt5Dirs) {
                $term = Join-Path $d 'terminal64.exe'
                $c = Join-Path $d 'tester.ini'
                $p = Start-Process -FilePath $term -ArgumentList @('/portable', ('/config:"' + $c + '"')) -WorkingDirectory $d -PassThru
                $procs += $p
              }

              $sw = [System.Diagnostics.Stopwatch]::StartNew()
              $timedOut = $false
              while (@($procs | Where-Object { -not $_.HasExited }).Count -gt 0) {
                try {
                  $cv = $pcCpu.NextValue()
                  if ($cv -gt $mCpu) { $mCpu = $cv }
                  $uv = $totRamMb - $pcRam.NextValue()
                  if ($uv -gt $mRam) { $mRam = $uv }
                } catch {}

                if ($sw.Elapsed.TotalSeconds -ge $timeoutSec) {
                  $timedOut = $true
                  break
                }
                Start-Sleep -Milliseconds 200
              }
              $sw.Stop()

              if ($timedOut) {
                foreach ($p in $procs) {
                  Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
                }
                throw "Timeout in $testName after $timeoutSec seconds"
              }

              Get-Process terminal64,metatester64 -ErrorAction SilentlyContinue | Wait-Process -Timeout 15 -ErrorAction SilentlyContinue
              Get-Process terminal64,metatester64 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 2

              $allOk = $true
              $bList = @()
              $tList = @()
              $depList = @()
              $idx = 1
              foreach ($d in $mt5Dirs) {
                $rpt = Join-Path $d 'report.htm'
                $b = 0; $tk = 0; $tr = -1; $dp = '0.00'
                if (Test-Path -LiteralPath $rpt -PathType Leaf) {
                  $htm = Get-Content -LiteralPath $rpt -Raw
                  if ($htm -match '<td[^>]*>Bars:</td>\s*<td[^>]*><b>(\d+)</b></td>') { $b = [int]$matches[1] }
                  if ($htm -match '<td[^>]*>Ticks:</td>\s*<td[^>]*><b>(\d+)</b></td>') { $tk = [int]$matches[1] }
                  if ($htm -match '<td[^>]*>Initial Deposit:</td>\s*<td[^>]*><b>([^<]+)</b></td>') { $dp = $matches[1].Trim() }
                  if ($htm -match '<td[^>]*>Total Trades:</td>\s*<td[^>]*><b>(\d+)</b></td>') { $tr = [int]$matches[1] }
                }

                $bList += $b
                $tList += $tk
                $depList += $dp

                if ($b -le 0 -or $tk -le 0 -or $tr -ne 0) {
                  $allOk = $false
                  Write-Host "[GRID] $testName Instance $idx FAILED (Bars=$b, Ticks=$tk, Trades=$tr)"
                } else {
                  Write-Host "[GRID] $testName Instance $idx OK (Bars=$b, Ticks=$tk, Trades=$tr, Deposit=$dp)"
                }
                $idx++
              }

              return [PSCustomObject]@{
                Name = $testName
                Passed = $allOk
                DurationSec = [math]::Round($sw.Elapsed.TotalSeconds, 1)
                PeakCpu = [math]::Round($mCpu, 1)
                PeakRamMb = [math]::Round($mRam, 0)
                Bars = $bList
                Ticks = $tList
                Deposit = $depList
              }
            }

            # =======================================================
            # CAPACITY TEST 1 — BASELINE (Single test)
            # =======================================================
            Write-Host '[GRID] CAPACITY_TEST_1_START'
            $bench1 = Run-ParallelBenchmark @($mt5) "SINGLE"
            if (-not $bench1.Passed) {
              Set-Stage 'SINGLE_TEST_FAILED'
              throw "Single test execution failed parity check"
            }
            Write-Host "[GRID] SINGLE_TEST_PASS (Duration: $($bench1.DurationSec)s, PeakCPU: $($bench1.PeakCpu)%, PeakRAM: $($bench1.PeakRamMb)MB)"

            $singleBars = $bench1.Bars[0]
            $singleTicks = $bench1.Ticks[0]
            $singleDeposit = $bench1.Deposit[0]

            Copy-Item -LiteralPath (Join-Path $mt5 'report.htm') -Destination (Join-Path $out 'report_single.htm') -Force

            # =======================================================
            # PHASE B: CAPACITY TEST 2 — TWO PARALLEL
            # ONLY IF SINGLE TEST PASSED
            # =======================================================
            Write-Host '[GRID] CAPACITY_TEST_2_START'
            Get-Process terminal64,metatester64 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 2

            $dirP2_1 = Join-Path $root 't_p2_1'
            $dirP2_2 = Join-Path $root 't_p2_2'

            Clone-Mt5Environment $defaultMt5 $mt5 $dirP2_1 $config
            Clone-Mt5Environment $defaultMt5 $mt5 $dirP2_2 $config

            $bench2 = Run-ParallelBenchmark @($dirP2_1, $dirP2_2) "PARALLEL_2"
            if ($bench2.Passed) {
              Write-Host "[GRID] PARALLEL_2_PASS (Duration: $($bench2.DurationSec)s, PeakCPU: $($bench2.PeakCpu)%, PeakRAM: $($bench2.PeakRamMb)MB)"
            } else {
              Write-Host "[GRID] PARALLEL_2_FAILED"
            }

            Copy-Item -LiteralPath (Join-Path $dirP2_1 'report.htm') -Destination (Join-Path $out 'report_p2_1.htm') -Force -ErrorAction SilentlyContinue
            Copy-Item -LiteralPath (Join-Path $dirP2_2 'report.htm') -Destination (Join-Path $out 'report_p2_2.htm') -Force -ErrorAction SilentlyContinue

            # =======================================================
            # CAPACITY TEST 4 — FOUR PARALLEL
            # ONLY IF PARALLEL_2 PASSED
            # =======================================================
            $bench4 = $null
            if ($bench2.Passed) {
              Write-Host '[GRID] CAPACITY_TEST_4_START'
              Get-Process terminal64,metatester64 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 2

              $dirP4_1 = Join-Path $root 't_p4_1'
              $dirP4_2 = Join-Path $root 't_p4_2'
              $dirP4_3 = Join-Path $root 't_p4_3'
              $dirP4_4 = Join-Path $root 't_p4_4'

              Clone-Mt5Environment $defaultMt5 $mt5 $dirP4_1 $config
              Clone-Mt5Environment $defaultMt5 $mt5 $dirP4_2 $config
              Clone-Mt5Environment $defaultMt5 $mt5 $dirP4_3 $config
              Clone-Mt5Environment $defaultMt5 $mt5 $dirP4_4 $config

              $bench4 = Run-ParallelBenchmark @($dirP4_1, $dirP4_2, $dirP4_3, $dirP4_4) "PARALLEL_4"
              if ($bench4.Passed) {
                Write-Host "[GRID] PARALLEL_4_PASS (Duration: $($bench4.DurationSec)s, PeakCPU: $($bench4.PeakCpu)%, PeakRAM: $($bench4.PeakRamMb)MB)"
              } else {
                Write-Host "[GRID] PARALLEL_4_FAILED"
              }

              Copy-Item -LiteralPath (Join-Path $dirP4_1 'report.htm') -Destination (Join-Path $out 'report_p4_1.htm') -Force -ErrorAction SilentlyContinue
              Copy-Item -LiteralPath (Join-Path $dirP4_2 'report.htm') -Destination (Join-Path $out 'report_p4_2.htm') -Force -ErrorAction SilentlyContinue
              Copy-Item -LiteralPath (Join-Path $dirP4_3 'report.htm') -Destination (Join-Path $out 'report_p4_3.htm') -Force -ErrorAction SilentlyContinue
              Copy-Item -LiteralPath (Join-Path $dirP4_4 'report.htm') -Destination (Join-Path $out 'report_p4_4.htm') -Force -ErrorAction SilentlyContinue
            }

            # Recommendation evaluation
            $safeTests = if ($bench4 -and $bench4.Passed) { "4" } elseif ($bench2.Passed) { "2" } else { "1" }
            $workers20 = if ($safeTests -eq "4") { "5" } elseif ($safeTests -eq "2") { "10" } else { "20" }

            # Build summary file
            $summaryLines = @(
              "WORKER_LOGICAL_CPUS=$logicalCpus",
              "WORKER_PHYSICAL_CORES=$physicalCores",
              "WORKER_RAM_GB=$totalRamGb",
              "WORKER_CPU_MODEL=$cpuModel",
              "SINGLE_PASS=$(if ($bench1.Passed) { 'PASS' } else { 'FAIL' })",
              "SINGLE_DURATION_SECONDS=$($bench1.DurationSec)",
              "SINGLE_PEAK_CPU_PERCENT=$($bench1.PeakCpu)",
              "SINGLE_PEAK_RAM_MB=$($bench1.PeakRamMb)",
              "SINGLE_BARS=$singleBars",
              "SINGLE_TICKS=$singleTicks",
              "SINGLE_DEPOSIT=$singleDeposit",
              "PARALLEL_2=$(if ($bench2.Passed) { 'PASS' } else { 'FAIL' })",
              "PARALLEL_2_DURATION_SECONDS=$($bench2.DurationSec)",
              "PARALLEL_2_PEAK_CPU_PERCENT=$($bench2.PeakCpu)",
              "PARALLEL_2_PEAK_RAM_MB=$($bench2.PeakRamMb)",
              "PARALLEL_4=$(if ($bench4 -and $bench4.Passed) { 'PASS' } elseif ($null -eq $bench4) { 'NOT_ATTEMPTED' } else { 'FAIL' })",
              "PARALLEL_4_DURATION_SECONDS=$(if ($bench4) { $bench4.DurationSec } else { 'N/A' })",
              "PARALLEL_4_PEAK_CPU_PERCENT=$(if ($bench4) { $bench4.PeakCpu } else { 'N/A' })",
              "PARALLEL_4_PEAK_RAM_MB=$(if ($bench4) { $bench4.PeakRamMb } else { 'N/A' })",
              "SAFE_TESTS_PER_WORKER=$safeTests",
              "WORKERS_REQUIRED_FOR_20=$workers20"
            )
            Set-Content -LiteralPath (Join-Path $out 'capacity_summary.txt') -Value $summaryLines -Encoding ascii

            $stage = 'OK'
            $code = 0
          } catch {
            if ($stage -eq 'INIT' -or $stage -eq 'OK') { $stage = 'EXECUTION_FAILED' }
            if ($code -eq 0) { $code = 1 }
            Write-Host "[GRID] $stage : $($_.Exception.Message)"
            Write-Host "[GRID] StackTrace: $($_.ScriptStackTrace)"
          } finally {
            if (Test-Path -LiteralPath $mt5) {
              $sf = Join-Path $mt5 'MQL5\Files\grid_prewarm.status'
              if (Test-Path -LiteralPath $sf) { Copy-Item -LiteralPath $sf -Destination $out -Force }

              Get-ChildItem -Path $mt5 -Filter '*.log' -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
                $logName = $_.FullName.Substring($mt5.Length).TrimStart('\').Replace('\', '_')
                Copy-Item -LiteralPath $_.FullName -Destination (Join-Path $out $logName) -Force
              }
            }

            Set-Content -LiteralPath (Join-Path $out 'opaque_id.txt') -Value $env:GRID_OPAQUE_ID -NoNewline -Encoding ascii
            Set-Content -LiteralPath (Join-Path $out 'stage.txt') -Value $stage -NoNewline -Encoding ascii
            Set-Content -LiteralPath (Join-Path $out 'exit.txt') -Value $code -NoNewline -Encoding ascii

            if (-not [string]::IsNullOrWhiteSpace($key) -and (Test-Path -LiteralPath $out)) {
              Push-Location $out
              try {
                & $seven a -t7z $encOut '.\*' "-p$key" -mhe=on -mx=7 *> $null
                if ($LASTEXITCODE -eq 0) {
                  Write-Host '[GRID] RESULT_READY'
                } else {
                  Write-Host '[GRID] RESULT_ENCRYPT_FAILED'
                }
              } finally { Pop-Location }
            }

            Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
            $key = $null

            "exit_code=$code" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "stage=$stage" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

          if ($stage -ne 'OK' -or $code -ne 0) {
            exit 1
          }

      - name: Upload encrypted result
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: grid-capacity-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/o.bin
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 0

      - name: Final status
        if: always()
        shell: powershell
        env:
          CODE: ${{ steps.run.outputs.exit_code }}
          STAGE: ${{ steps.run.outputs.stage }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CODE) -or [int]$env:CODE -ne 0) {
            Write-Host "[GRID] FAILED (stage: $env:STAGE)"
            exit 1
          }
          Write-Host '[GRID] OK'

name: Compile MQL5 EAs (Public Cloud Gate)
run-name: compile-${{ inputs.opaque_id }}

on:
  workflow_dispatch:
    inputs:
      lane_id:
        description: 'Key lane ID (00-39)'
        required: true
        type: string
        default: '00'
      package_url:
        description: 'Encrypted task package URL'
        required: true
        type: string
      package_sha256:
        description: 'Package SHA256'
        required: true
        type: string
      opaque_id:
        description: 'Opaque session ID'
        required: true
        type: string

jobs:
  compile:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Official MetaTrader 5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $env:RUNNER_TEMP 's.exe'
          Write-Host "[COMPILE] Downloading official MT5 installer..."
          Invoke-WebRequest -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' -OutFile $setup -UseBasicParsing
          Write-Host "[COMPILE] Installing MT5 headlessly..."
          Start-Process -FilePath $setup -ArgumentList '/auto' | Out-Null

          $defaultMt5 = Join-Path $env:ProgramFiles 'MetaTrader 5'
          $termDefault = Join-Path $defaultMt5 'terminal64.exe'
          $deadline = (Get-Date).AddMinutes(5)
          while (-not (Test-Path $termDefault -PathType Leaf) -and (Get-Date) -lt $deadline) {
              Start-Sleep -Seconds 3
          }
          Start-Sleep -Seconds 5
          Get-Process terminal64,metatester64,s,mt5setup -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

          $editor = Join-Path $defaultMt5 'metaeditor64.exe'
          if (-not (Test-Path $editor -PathType Leaf)) { throw "metaeditor64.exe missing at $editor" }
          Write-Host "[COMPILE] MT5 installed successfully at $defaultMt5"

      - name: Decrypt & Compile MQL5 Strategies
        shell: powershell
        env:
          GRID_SESSION_KEY: ${{
            inputs.lane_id == '00' && secrets.GRID_LANE_KEY_00 ||
            inputs.lane_id == '01' && secrets.GRID_LANE_KEY_01 ||
            inputs.lane_id == '02' && secrets.GRID_LANE_KEY_02 ||
            inputs.lane_id == '03' && secrets.GRID_LANE_KEY_03 ||
            inputs.lane_id == '04' && secrets.GRID_LANE_KEY_04 ||
            inputs.lane_id == '05' && secrets.GRID_LANE_KEY_05 ||
            inputs.lane_id == '06' && secrets.GRID_LANE_KEY_06 ||
            inputs.lane_id == '07' && secrets.GRID_LANE_KEY_07 ||
            inputs.lane_id == '08' && secrets.GRID_LANE_KEY_08 ||
            inputs.lane_id == '09' && secrets.GRID_LANE_KEY_09 ||
            inputs.lane_id == '10' && secrets.GRID_LANE_KEY_10 ||
            inputs.lane_id == '11' && secrets.GRID_LANE_KEY_11 ||
            inputs.lane_id == '12' && secrets.GRID_LANE_KEY_12 ||
            inputs.lane_id == '13' && secrets.GRID_LANE_KEY_13 ||
            inputs.lane_id == '14' && secrets.GRID_LANE_KEY_14 ||
            inputs.lane_id == '15' && secrets.GRID_LANE_KEY_15 ||
            inputs.lane_id == '16' && secrets.GRID_LANE_KEY_16 ||
            inputs.lane_id == '17' && secrets.GRID_LANE_KEY_17 ||
            inputs.lane_id == '18' && secrets.GRID_LANE_KEY_18 ||
            inputs.lane_id == '19' && secrets.GRID_LANE_KEY_19 ||
            inputs.lane_id == '20' && secrets.GRID_LANE_KEY_20 ||
            inputs.lane_id == '21' && secrets.GRID_LANE_KEY_21 ||
            inputs.lane_id == '22' && secrets.GRID_LANE_KEY_22 ||
            inputs.lane_id == '23' && secrets.GRID_LANE_KEY_23 ||
            inputs.lane_id == '24' && secrets.GRID_LANE_KEY_24 ||
            inputs.lane_id == '25' && secrets.GRID_LANE_KEY_25 ||
            inputs.lane_id == '26' && secrets.GRID_LANE_KEY_26 ||
            inputs.lane_id == '27' && secrets.GRID_LANE_KEY_27 ||
            inputs.lane_id == '28' && secrets.GRID_LANE_KEY_28 ||
            inputs.lane_id == '29' && secrets.GRID_LANE_KEY_29 ||
            inputs.lane_id == '30' && secrets.GRID_LANE_KEY_30 ||
            inputs.lane_id == '31' && secrets.GRID_LANE_KEY_31 ||
            inputs.lane_id == '32' && secrets.GRID_LANE_KEY_32 ||
            inputs.lane_id == '33' && secrets.GRID_LANE_KEY_33 ||
            inputs.lane_id == '34' && secrets.GRID_LANE_KEY_34 ||
            inputs.lane_id == '35' && secrets.GRID_LANE_KEY_35 ||
            inputs.lane_id == '36' && secrets.GRID_LANE_KEY_36 ||
            inputs.lane_id == '37' && secrets.GRID_LANE_KEY_37 ||
            inputs.lane_id == '38' && secrets.GRID_LANE_KEY_38 ||
            inputs.lane_id == '39' && secrets.GRID_LANE_KEY_39 || ''
            }}
          GRID_PACKAGE_URL: ${{ inputs.package_url }}
          GRID_PACKAGE_SHA256: ${{ inputs.package_sha256 }}
          GRID_OPAQUE_ID: ${{ inputs.opaque_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $key = $env:GRID_SESSION_KEY
          $seven = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
          $root = Join-Path $env:RUNNER_TEMP 'compile_root'
          $encIn = Join-Path $root 'input.7z'
          $payload = Join-Path $root 'payload'
          $outDir = Join-Path $env:RUNNER_TEMP 'compiled_binaries'
          New-Item -ItemType Directory -Force -Path $root, $payload, $outDir | Out-Null

          Write-Host "[COMPILE] Downloading payload..."
          Invoke-WebRequest -Uri $env:GRID_PACKAGE_URL -OutFile $encIn -UseBasicParsing
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $encIn).Hash
          if (-not $hash.Equals($env:GRID_PACKAGE_SHA256, [System.StringComparison]::OrdinalIgnoreCase)) {
              throw "Package SHA256 mismatch!"
          }

          Write-Host "[COMPILE] Decrypting payload..."
          & $seven x $encIn "-p$key" "-o$payload" -y *> $null
          if ($LASTEXITCODE -ne 0) { throw "Decryption failed!" }

          $defaultMt5 = Join-Path $env:ProgramFiles 'MetaTrader 5'
          $baseMt5 = Join-Path $env:RUNNER_TEMP 'mt5'
          Write-Host "[COMPILE] Copying MT5 runtime to writable user space: $baseMt5..."
          New-Item -ItemType Directory -Force -Path $baseMt5 | Out-Null
          & robocopy $defaultMt5 $baseMt5 /E /NFL /NDL /NJH /NJS | Out-Null
          if ($LASTEXITCODE -gt 7) { throw "Robocopy failed with exit code $LASTEXITCODE" }

          $metaeditor = Join-Path $baseMt5 'metaeditor64.exe'
          $mql5Dir = Join-Path $baseMt5 'MQL5'
          $expertsDir = Join-Path $mql5Dir 'Experts'
          New-Item -ItemType Directory -Force -Path $expertsDir | Out-Null

          # Sync AppData headers if needed
          $tradeMql = Get-ChildItem -Path "$env:APPDATA\MetaQuotes" -Recurse -Filter "Trade.mqh" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($tradeMql) {
              $appDataMql = Split-Path (Split-Path $tradeMql.FullName -Parent) -Parent
              Write-Host "[COMPILE] Syncing MQL5 library from $appDataMql to $mql5Dir..."
              & robocopy $appDataMql $mql5Dir /E /NFL /NDL /NJH /NJS | Out-Null
          }

          # Copy payload source folders into MQL5/Experts (and Include into MQL5/Include)
          Get-ChildItem -Path $payload -Directory | ForEach-Object {
              if ($_.Name -eq "Include") {
                  Write-Host "[COMPILE] Staging Include library into $mql5Dir\Include..."
                  $targetInc = Join-Path $mql5Dir 'Include'
                  New-Item -ItemType Directory -Force -Path $targetInc | Out-Null
                  & robocopy $_.FullName $targetInc /E /NFL /NDL /NJH /NJS | Out-Null
              } else {
                  Write-Host "[COMPILE] Staging $($_.Name) into $expertsDir..."
                  $targetExp = Join-Path $expertsDir $_.Name
                  New-Item -ItemType Directory -Force -Path $targetExp | Out-Null
                  & robocopy $_.FullName $targetExp /E /NFL /NDL /NJH /NJS | Out-Null
              }
          }

          $targets = @(
              @{ Name = "MOB 17547"; Path = (Join-Path $expertsDir "Mitigation-Order-Blocks\MOB_Research_EA.mq5"); Out = "MOB_Research_EA.ex5" },
              @{ Name = "IFVG 20361"; Path = (Join-Path $expertsDir "Inverse-Fair-Value-Gap\IFVG_StateMachine_EA.mq5"); Out = "IFVG_StateMachine_EA.ex5" },
              @{ Name = "Turtle 23448"; Path = (Join-Path $expertsDir "Turtle-Trading\TurtleTradingEA.mq5"); Out = "TurtleTradingEA.ex5" }
          )

          $successCount = 0
          foreach ($t in $targets) {
              if (-not (Test-Path $t.Path)) {
                  Write-Host "[COMPILE-SKIP] $($t.Name) source not found at $($t.Path)"
                  continue
              }
              Write-Host "=================================================="
              Write-Host "[COMPILE] Compiling $($t.Name) ($($t.Path))..."
              $logFile = [System.IO.Path]::ChangeExtension($t.Path, '.log')
              $p = Start-Process -FilePath $metaeditor -ArgumentList @("/portable", "/compile:$($t.Path)", "/log:$logFile") -PassThru -Wait
              
              if (Test-Path $logFile) {
                  Write-Host "--- COMPILE LOG: $($t.Name) ---"
                  Get-Content $logFile
                  Write-Host "-------------------------------"
              } else {
                  Write-Host "[COMPILE-WARN] Log file $logFile was not created."
              }

              $ex5 = [System.IO.Path]::ChangeExtension($t.Path, '.ex5')
              if (Test-Path $ex5) {
                  $dest = Join-Path $outDir $t.Out
                  Copy-Item $ex5 $dest -Force
                  $size = (Get-Item $dest).Length
                  $sha = (Get-FileHash -Path $dest -Algorithm SHA256).Hash
                  Write-Host "[COMPILE-SUCCESS] $($t.Out) produced: Size=$size bytes, SHA256=$sha"
                  $successCount++
              } else {
                  Write-Host "[COMPILE-FAIL] $($t.Out) was not generated! ExitCode=$($p.ExitCode)"
              }
          }

          Write-Host "[COMPILE] Successfully compiled $successCount binaries."
          if ($successCount -eq 0) { throw "Zero binaries compiled!" }

      - name: Upload Compiled Binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiled-binaries-${{ inputs.opaque_id }}
          path: ${{ runner.temp }}/compiled_binaries
          retention-days: 7

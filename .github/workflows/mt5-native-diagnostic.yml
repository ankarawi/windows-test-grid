name: MT5 Native Diagnostic

on:
  workflow_dispatch:
    inputs:
      package_url:
        description: 'Encrypted package URL'
        required: true
        type: string
      package_sha256:
        description: 'Package SHA256'
        required: true
        type: string
      opaque_id:
        description: 'Opaque session ID'
        required: true
        type: string

jobs:
  diagnostic-node:
    runs-on: windows-2022
    timeout-minutes: 125

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Execute Native Diagnostic Node
        shell: powershell
        env:
          GRID_SESSION_KEY: ${{ secrets.GRID_SESSION_KEY }}
          GRID_PACKAGE_URL: ${{ inputs.package_url }}
          GRID_PACKAGE_SHA256: ${{ inputs.package_sha256 }}
          GRID_OPAQUE_ID: ${{ inputs.opaque_id }}
          GRID_WORKER_ID: diagnostic-00
        run: |
          ./runner/native_diagnostic_node.ps1

      - name: Upload Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grid-diag-${{ inputs.opaque_id }}
          path: ${{ runner.temp }}/o.bin
          if-no-files-found: warn
          retention-days: 1

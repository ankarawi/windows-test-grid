name: Aasal Secure Bootstrap

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/aasal-secure-bootstrap.yml"

permissions:
  contents: write

jobs:
  publish-public-key:
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      AASAL_GRID_KEY: ${{ secrets.GRID_LANE_KEY_00 }}
    steps:
      - uses: actions/checkout@v4
      - name: Derive public DH key
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AASAL_GRID_KEY)) { throw "GRID_LANE_KEY_00_MISSING" }
          @'
          const fs = require("fs");
          const crypto = require("crypto");
          const P = BigInt("");
          const G = 2n;
          function modPow(b,e,m){ let r=1n; b%=m; while(e>0n){ if(e&1n) r=(r*b)%m; e>>=1n; b=(b*b)%m; } return r; }
          const seed = crypto.createHash("sha256").update(process.env.AASAL_GRID_KEY + "\nAASAL_EXACT_HEAD_V2").digest("hex");
          const x = (BigInt("0x"+seed) % (P-3n)) + 2n;
          const A = modPow(G,x,P);
          fs.mkdirSync(".secure",{recursive:true});
          fs.writeFileSync(".secure/aasal-dh-public.json", JSON.stringify({
            schema:"aasal-secure-dh-v2",
            group:"rfc3526-modp-2048",
            primeHex:P.toString(16),
            generator:"2",
            publicHex:A.toString(16)
          },null,2));
          '@ | Set-Content -Encoding utf8 "$env:RUNNER_TEMP\derive.js"
          node "$env:RUNNER_TEMP\derive.js"
      - name: Commit public key only
        shell: pwsh
        run: |
          git config user.name "aasal-secure-bootstrap"
          git config user.email "aasal-secure-bootstrap@users.noreply.github.com"
          git add .secure/aasal-dh-public.json
          if (git diff --cached --quiet) {
            Write-Host "PUBLIC_KEY_ALREADY_CURRENT"
            exit 0
          }
          git commit -m "chore(grid): publish aasal secure public key v2 [skip ci]"
          git push origin HEAD:main
